name: Performance Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'web/gatsby-config.js'
      - 'web/gatsby-node.js'
      - '.github/workflows/performance-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Run performance benchmark
        id: benchmark
        run: |
          cd web
          npm run perf:benchmark 2>&1 | tee benchmark-output.txt
        continue-on-error: true

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const benchmarksDir = path.join(process.cwd(), 'web/.benchmarks');

            // Find and delete existing benchmark comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments) {
              if (comment.user.type === 'Bot' && comment.body.includes('📊 Performance Benchmark')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Build results comment
            let body = '## 📊 Performance Benchmark Results\n\n';

            const mainPath = path.join(benchmarksDir, 'main-results.json');
            const branchPath = path.join(benchmarksDir, 'branch-results.json');

            if (fs.existsSync(mainPath) && fs.existsSync(branchPath)) {
              const main = JSON.parse(fs.readFileSync(mainPath, 'utf8'));
              const branch = JSON.parse(fs.readFileSync(branchPath, 'utf8'));

              body += '| Metric | Main | PR | Change |\n';
              body += '|--------|------|----|---------|\n';

              const metrics = [
                { name: 'Performance Score', key: 'performance', unit: '/100', isBetter: 'higher' },
                { name: 'LCP (Largest Contentful Paint)', key: 'lcp', unit: 'ms', isBetter: 'lower' },
                { name: 'FCP (First Contentful Paint)', key: 'fcp', unit: 'ms', isBetter: 'lower' },
                { name: 'CLS (Cumulative Layout Shift)', key: 'cls', unit: '', isBetter: 'lower' },
                { name: 'Image Size', key: 'totalImageSize', unit: 'KB', isBetter: 'lower' },
              ];

              metrics.forEach(({ name, key, unit, isBetter }) => {
                const mainVal = main[key];
                const branchVal = branch[key];
                const diff = branchVal - mainVal;
                const pctChange = mainVal !== 0 ? ((diff / mainVal) * 100).toFixed(1) : 0;

                const isImprovement =
                  (isBetter === 'higher' && diff > 0) ||
                  (isBetter === 'lower' && diff < 0);

                const arrow = diff < 0 ? '↓' : diff > 0 ? '↑' : '→';
                const emoji = Math.abs(pctChange) < 3 ? '' : isImprovement ? ' ✨' : ' ⚠️';

                const mainStr = typeof mainVal === 'number' ? mainVal.toFixed(mainVal < 10 ? 2 : 0) : mainVal;
                const branchStr = typeof branchVal === 'number' ? branchVal.toFixed(branchVal < 10 ? 2 : 0) : branchVal;

                body += `| ${name} | ${mainStr}${unit} | ${branchStr}${unit} | ${arrow} ${pctChange}%${emoji} |\n`;
              });
            } else {
              body += '❌ Benchmark results not available\n';
            }

            body += '\n---\n';
            body += '> ℹ️ **Performance benchmarks are informational** and do not block PRs.\n';
            body += '> Changes within ±3% are typically within margin of error.\n';
            body += '> 📖 [View benchmarking guide](../PERFORMANCE_BENCHMARKING.md)\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks
          path: web/.benchmarks/
          retention-days: 30
