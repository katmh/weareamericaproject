# Web Performance Benchmark Workflow
#
# Automatically measures web performance metrics on every PR that touches source files.
# Results are posted as a PR comment for visibility and uploaded as artifacts.
#
# Features:
#   - Non-blocking: Never fails the workflow (continue-on-error: true)
#   - Automatic comparison: main branch vs PR branch
#   - Core Web Vitals tracking: FCP, LCP, CLS, TTI, TBT
#   - Resource analysis: Image sizes, script sizes, font sizes
#   - Smart threshold: 3% variance ignored to avoid false positives
#   - PR comment: Results displayed inline for easy review
#
# Use cases:
#   - Quantifying impact of performance optimizations
#   - Detecting unintended performance regressions
#   - Tracking performance trends over time
#   - Informing code review discussions with data
#
# Results are informational only and do not affect PR approval.

name: Performance Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'web/gatsby-config.js'
      - 'web/gatsby-node.js'
      - '.github/workflows/performance-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Run performance benchmark
        id: benchmark
        run: |
          cd web
          npm run perf:benchmark 2>&1 | tee benchmark-output.txt
        continue-on-error: true

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const benchmarksDir = path.join(process.cwd(), 'web/.benchmarks');
            const MARKER = '<!-- perf-benchmark-comment -->';

            // Find existing benchmark comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            let existingCommentId = null;
            for (const comment of comments) {
              if (comment.body.includes(MARKER)) {
                existingCommentId = comment.id;
                break;
              }
            }

            // Build results comment
            let body = MARKER + '\n## 📊 Performance Benchmark Results\n\n';

            const mainPath = path.join(benchmarksDir, 'main-results.json');
            const branchPath = path.join(benchmarksDir, 'branch-results.json');

            if (fs.existsSync(mainPath) && fs.existsSync(branchPath)) {
              const main = JSON.parse(fs.readFileSync(mainPath, 'utf8'));
              const branch = JSON.parse(fs.readFileSync(branchPath, 'utf8'));

              body += '| Metric | Main | PR | Change |\n';
              body += '|--------|------|----|---------|\n';

              const metrics = [
                { name: 'Performance Score', key: 'performance', unit: '/100', isBetter: 'higher' },
                { name: 'LCP (Largest Contentful Paint)', key: 'lcp', unit: 'ms', isBetter: 'lower' },
                { name: 'FCP (First Contentful Paint)', key: 'fcp', unit: 'ms', isBetter: 'lower' },
                { name: 'CLS (Cumulative Layout Shift)', key: 'cls', unit: '', isBetter: 'lower' },
                { name: 'Image Size', key: 'totalImageSize', unit: 'KB', isBetter: 'lower' },
              ];

              metrics.forEach(({ name, key, unit, isBetter }) => {
                const mainVal = main[key];
                const branchVal = branch[key];
                const diff = branchVal - mainVal;
                const pctChange = mainVal !== 0 ? ((diff / mainVal) * 100).toFixed(1) : 0;

                const isImprovement =
                  (isBetter === 'higher' && diff > 0) ||
                  (isBetter === 'lower' && diff < 0);

                const arrow = diff < 0 ? '↓' : diff > 0 ? '↑' : '→';
                const emoji = Math.abs(pctChange) < 3 ? '' : isImprovement ? ' ✨' : ' ⚠️';

                const mainStr = typeof mainVal === 'number' ? mainVal.toFixed(mainVal < 10 ? 2 : 0) : mainVal;
                const branchStr = typeof branchVal === 'number' ? branchVal.toFixed(branchVal < 10 ? 2 : 0) : branchVal;

                body += `| ${name} | ${mainStr}${unit} | ${branchStr}${unit} | ${arrow} ${pctChange}%${emoji} |\n`;
              });
            } else {
              body += '❌ Benchmark results not available\n';
            }


            // Update existing comment or create new one
            if (existingCommentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingCommentId,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

