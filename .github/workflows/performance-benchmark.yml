# Web Performance Benchmark Workflow
#
# Automatically compares performance between production and the Netlify deploy preview.
# Results are posted as a PR comment for visibility.
#
# Process:
#   1. Waits for Netlify deploy preview to be ready (up to 10 minutes)
#   2. Benchmarks production (https://weareamericaproject.com)
#   3. Benchmarks the deploy preview
#   4. Compares metrics and posts results in PR comment
#
# Features:
#   - Non-blocking: Never fails the workflow (continue-on-error: true)
#   - Real deployment comparison: Production vs actual deploy
#   - Core Web Vitals tracking: FCP, LCP, CLS
#   - Real-world metrics: Actual CDN, caching, compression
#   - Smart threshold: 3% variance ignored to avoid false positives
#   - PR comment: Results displayed inline for easy review
#
# Why compare deployments?
#   - Production-realistic performance metrics
#   - Shows actual user-facing impact of changes
#   - No local system variance
#   - Includes CDN, caching, and compression effects
#
# Results are informational only and do not affect PR approval.

name: Performance Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'web/gatsby-config.js'
      - 'web/gatsby-node.js'
      - '.github/workflows/performance-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Find Netlify deploy preview URL
        id: netlify-url
        uses: actions/github-script@v7
        with:
          script: |
            // Poll for Netlify bot comment with deploy preview URL
            let deployUrl = null;
            let attempts = 0;
            const maxAttempts = 24; // ~2 minutes with 5 second intervals

            while (!deployUrl && attempts < maxAttempts) {
              attempts++;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              // Look for Netlify bot comment with deploy preview URL
              for (const comment of comments) {
                if (comment.user.login === 'netlify' || comment.user.login.includes('netlify')) {
                  // Extract URL from comment body (Netlify comments contain deploy preview link)
                  const match = comment.body.match(/https:\/\/deploy-preview-\d+--[^\s\)]+/);
                  if (match) {
                    deployUrl = match[0];
                    console.log(`Found deploy preview URL: ${deployUrl}`);
                    break;
                  }
                }
              }

              if (!deployUrl) {
                if (attempts < maxAttempts) {
                  console.log(`Attempt ${attempts}/${maxAttempts}: Netlify comment not found yet, waiting...`);
                  await new Promise(resolve => setTimeout(resolve, 5000));
                } else {
                  console.log('Timeout: Netlify deploy preview comment not found');
                }
              }
            }

            if (deployUrl) {
              core.setOutput('deploy_url', deployUrl);
            } else {
              core.setFailed('Could not find Netlify deploy preview URL');
            }
        continue-on-error: true

      - name: Wait for Netlify deploy to complete
        id: netlify-ready
        if: steps.netlify-url.outputs.deploy_url
        timeout-minutes: 10
        uses: actions/github-script@v7
        with:
          script: |
            // Wait for Netlify deploy-preview status to be SUCCESS
            const maxAttempts = 60; // ~10 minutes with 10 second intervals
            let attempts = 0;
            let deployReady = false;

            while (attempts < maxAttempts && !deployReady) {
              attempts++;
              const { data: rollup } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
              });

              // Look for any netlify/*/deploy-preview status
              const netlifyStatus = rollup.statuses?.find(status =>
                status.context.includes('netlify') && status.context.includes('deploy-preview')
              );

              if (netlifyStatus?.state === 'success') {
                console.log(`✅ Netlify deploy preview ready: ${netlifyStatus.target_url}`);
                deployReady = true;
              } else if (netlifyStatus?.state === 'failure') {
                core.setFailed('Netlify deploy preview failed');
                return;
              } else {
                console.log(`Attempt ${attempts}/${maxAttempts}: Waiting for Netlify deployment...`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }

            if (!deployReady) {
              core.setFailed('Timeout waiting for Netlify deployment to complete');
            }
        continue-on-error: true

      - name: Run performance comparison (parallel)
        id: benchmark
        if: steps.netlify-ready.outcome == 'success'
        timeout-minutes: 5
        run: |
          cd web

          # Run both audits in parallel
          npm run perf:url -- "https://weareamericaproject.com" &
          PROD_PID=$!

          npm run perf:url -- "${{ steps.netlify-url.outputs.deploy_url }}" &
          PREVIEW_PID=$!

          # Wait for both to complete
          wait $PROD_PID $PREVIEW_PID

          # Now compare the results
          npm run perf:compare -- \
            "https://weareamericaproject.com" \
            "${{ steps.netlify-url.outputs.deploy_url }}" \
            --name1 "Production" \
            --name2 "Preview" 2>&1 | tee benchmark-output.txt
        continue-on-error: true

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const benchmarksDir = path.join(process.cwd(), 'web/.benchmarks');
            const MARKER = '<!-- perf-benchmark-comment -->';

            // Find existing benchmark comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            let existingCommentId = null;
            for (const comment of comments) {
              if (comment.body.includes(MARKER)) {
                existingCommentId = comment.id;
                break;
              }
            }

            // Build results comment
            let body = MARKER + '\n## 📊 Performance: Production vs Preview\n\n';

            const url1Path = path.join(benchmarksDir, 'lighthouse-url1-' + new Date().toISOString().slice(0, 10) + '.json');
            const url2Path = path.join(benchmarksDir, 'lighthouse-url2-' + new Date().toISOString().slice(0, 10) + '.json');

            if (fs.existsSync(url1Path) && fs.existsSync(url2Path)) {
              const url1Data = JSON.parse(fs.readFileSync(url1Path, 'utf8'));
              const url2Data = JSON.parse(fs.readFileSync(url2Path, 'utf8'));

              const getMetric = (obj, key) => obj.audits?.[key]?.numericValue || obj[key] || 0;

              const url1 = {
                performance: Math.round(url1Data.categories?.performance?.score * 100 || 0),
                fcp: getMetric(url1Data, 'first-contentful-paint'),
                lcp: getMetric(url1Data, 'largest-contentful-paint'),
                cls: getMetric(url1Data, 'cumulative-layout-shift'),
              };

              const url2 = {
                performance: Math.round(url2Data.categories?.performance?.score * 100 || 0),
                fcp: getMetric(url2Data, 'first-contentful-paint'),
                lcp: getMetric(url2Data, 'largest-contentful-paint'),
                cls: getMetric(url2Data, 'cumulative-layout-shift'),
              };

              body += '| Metric | Production | Preview | Change |\n';
              body += '|--------|------------|---------|--------|\n';

              const metrics = [
                { name: 'Performance Score', key: 'performance', unit: '/100', isBetter: 'higher' },
                { name: 'LCP', key: 'lcp', unit: 'ms', isBetter: 'lower' },
                { name: 'FCP', key: 'fcp', unit: 'ms', isBetter: 'lower' },
                { name: 'CLS', key: 'cls', unit: '', isBetter: 'lower' },
              ];

              metrics.forEach(({ name, key, unit, isBetter }) => {
                const prodVal = url1[key];
                const previewVal = url2[key];
                const diff = previewVal - prodVal;
                const pctChange = prodVal !== 0 ? ((diff / prodVal) * 100).toFixed(1) : 0;

                const isImprovement =
                  (isBetter === 'higher' && diff > 0) ||
                  (isBetter === 'lower' && diff < 0);

                const arrow = diff < 0 ? '↓' : diff > 0 ? '↑' : '→';
                const emoji = Math.abs(pctChange) < 3 ? '' : isImprovement ? ' ✨' : ' ⚠️';

                const prodStr = typeof prodVal === 'number' ? prodVal.toFixed(prodVal < 10 ? 2 : 0) : prodVal;
                const previewStr = typeof previewVal === 'number' ? previewVal.toFixed(previewVal < 10 ? 2 : 0) : previewVal;

                body += `| ${name} | ${prodStr}${unit} | ${previewStr}${unit} | ${arrow} ${pctChange}%${emoji} |\n`;
              });
            } else {
              body += '❌ Benchmark results not available (deploy preview may not be ready yet)\n';
            }


            // Update existing comment or create new one
            if (existingCommentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingCommentId,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

